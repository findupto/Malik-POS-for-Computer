name: Verify Malik POS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check backend and backup script syntax
        run: |
          node --check server/index.mjs
          sh -n server/backup.sh server/restore.sh
      - name: Run all unit tests
        run: npm test
      - name: Build API container image
        run: docker build -f server/Dockerfile -t malik-pos-api:ci .
      - name: Build web application
        run: npm run build
