name: Dependency Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate a temporary dependency lock for auditing
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Report known dependency vulnerabilities
        run: npm audit --audit-level=high
