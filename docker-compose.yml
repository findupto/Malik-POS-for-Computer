services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: malik_pos
      POSTGRES_USER: malik_pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - malik_pos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malik_pos -d malik_pos"]
      interval: 10s
      timeout: 5s
      retries: 5
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://malik_pos:${POSTGRES_PASSWORD}@db:5432/malik_pos
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./server/backup.sh:/usr/local/bin/malik-backup.sh:ro
      - ./server/backup-healthcheck.sh:/usr/local/bin/malik-backup-healthcheck.sh:ro
      - malik_pos_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh /usr/local/bin/malik-backup-healthcheck.sh"]
      interval: 15m
      timeout: 30s
      retries: 2
      start_period: 5m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          sh /usr/local/bin/malik-backup.sh || echo "WARNING: Malik POS database backup failed" >&2
          sleep "$BACKUP_INTERVAL_SECONDS"
        done
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://malik_pos:${POSTGRES_PASSWORD}@db:5432/malik_pos
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in server/.env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-owner}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in server/.env}
      DEFAULT_LOCATION_NAME: ${DEFAULT_LOCATION_NAME:-Main location}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:5173}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
volumes:
  malik_pos_db:
  malik_pos_backups:
